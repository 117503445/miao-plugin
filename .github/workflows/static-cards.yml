name: Static account cards
on:
  push:
    paths: ['web/**', 'models/artis/**', 'resources/**', '.github/workflows/static-cards.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: web/node_modules/.bin/tsx --test web/src/route.test.ts web/src/enhancements.test.ts
      - run: web/node_modules/.bin/tsx web/tools/test-attributes.ts
      - run: npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: mihoyo-static-cards
          path: web/dist
